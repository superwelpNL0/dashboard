<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Character Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0f1218;--s1:#171b24;--s2:#1e2330;--s3:#282f40;--line:#2a3141;--line2:#3b4560;
  --tx:#ebe8df;--mu:#9aa3b5;--ac:#e8b04f;--ac2:#f2c673;--ink:#241a05;--sea:#6fcfbd;--rose:#ee7c88;
  --disp:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 var(--body);min-height:100vh}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--disp);margin:0;font-weight:700;letter-spacing:-.015em;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mu{color:var(--mu)}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(15,18,24,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:14px}
.brand{font-family:var(--disp);font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--ac);color:var(--ink);display:grid;place-items:center}
.sp{flex:1}
.save{font-size:12.5px;color:var(--mu);display:flex;align-items:center;gap:7px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--sea)}
.save.saving i{background:var(--ac)}
.save.error i,.save.memory i{background:var(--rose)}

main{max-width:1200px;margin:0 auto;padding:26px 20px 90px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--s2);border-radius:11px;padding:9px 15px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--s3)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.btn.pri:hover{background:var(--ac2)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{color:var(--rose);background:transparent}
.btn.danger:hover{background:rgba(238,124,136,.12);border-color:var(--rose)}
.btn.dangerfill{background:var(--rose);border-color:var(--rose);color:#2a0d14}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.icon{padding:9px}
.iconbtn{background:transparent;border:0;color:var(--mu);cursor:pointer;padding:7px;border-radius:8px;display:grid;place-items:center}
.iconbtn:hover{color:var(--tx);background:var(--s3)}
.iconbtn.del:hover{color:var(--rose);background:rgba(238,124,136,.1)}

/* home */
.pagehead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:clamp(30px,5vw,46px)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:220px;position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mu)}
.search input{width:100%;background:var(--s1);border:1px solid var(--line2);border-radius:11px;padding:11px 14px 11px 42px}
.search input::placeholder{color:var(--mu)}
.search input:focus{outline:none;border-color:var(--ac)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.chip{background:var(--s1);border:1px solid var(--line2);border-radius:999px;padding:7px 15px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--mu);display:inline-flex;gap:7px;align-items:center}
.chip b{font-weight:600;opacity:.75}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.sel{display:inline-flex;align-items:center;gap:8px;color:var(--mu);font-size:13.5px;font-weight:600}
.sel select,.inline-sel{background:var(--s1);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;font-size:13.5px;max-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.ccard{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;transition:border-color .15s}
.ccard:hover{border-color:var(--line2)}
.pfp{position:relative;display:block;aspect-ratio:4/5;border-radius:11px;overflow:hidden;background:var(--s2)}
.pfp .av{width:100%;height:100%;object-fit:cover;display:block}
.agebadge{position:absolute;left:8px;bottom:8px;background:rgba(15,18,24,.8);backdrop-filter:blur(4px);padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600}
.ci{padding:10px 6px 6px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.ci h3{font-size:18px;overflow-wrap:anywhere}
.hobs{display:flex;flex-wrap:wrap;gap:5px}
.hob{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--s3);color:#d6d9e2}
.desc{color:#c3c9d6;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0;overflow-wrap:anywhere}
.cfoot{margin-top:auto;font-size:12.5px;color:var(--sea);display:flex;gap:6px;align-items:center;padding-top:2px}
.hit{font-size:12.5px;color:var(--mu);border-top:1px dashed var(--line2);padding-top:7px;overflow-wrap:anywhere}
.cbtn{position:absolute;top:14px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(15,18,24,.72);backdrop-filter:blur(6px);color:var(--tx);display:grid;place-items:center;cursor:pointer}
.cbtn:hover{background:rgba(15,18,24,.9)}
.cbtn.l{left:14px}.cbtn.r{right:14px}
.star[aria-pressed=true]{color:var(--ac)}
.star[aria-pressed=true] svg{fill:var(--ac)}
.star.flat{position:static;background:var(--s2);border:1px solid var(--line2);width:38px;height:38px}
.menu{position:absolute;top:54px;right:14px;z-index:10;background:var(--s2);border:1px solid var(--line2);border-radius:12px;padding:6px;min-width:176px;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.menu button{display:flex;gap:9px;align-items:center;width:100%;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;font-size:14px}
.menu button:hover{background:var(--s3)}
.menu button.danger{color:var(--rose)}
.av{display:block;object-fit:cover;background:var(--s2)}
.av.ph{display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:48px;color:hsl(var(--h) 62% 80%);background:hsl(var(--h) 30% 20%)}
.av.xs{width:22px;height:22px;border-radius:6px;font-size:10px}
.av.s{width:42px;height:42px;border-radius:11px;font-size:17px}
.av.xl{width:164px;height:164px;border-radius:22px;font-size:56px}
.sec{margin-bottom:30px}
.sec>h2{font-size:21px;margin-bottom:14px}
.empty{border:1.5px dashed var(--line2);border-radius:16px;padding:34px 22px;text-align:center;color:var(--mu)}
.empty h3{color:var(--tx);margin-bottom:6px;font-size:20px}
.empty p{margin:0 auto;max-width:46ch}
.empty .btn{margin-top:16px}
footer.foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--mu);font-size:13px}
mark{background:rgba(232,176,79,.3);color:var(--tx);border-radius:4px;padding:0 2px}
.warn{background:rgba(238,124,136,.12);border:1px solid var(--rose);padding:10px 14px;border-radius:12px;margin-bottom:18px;font-size:14px}

/* profile */
.topnav{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--mu);font-size:13.5px;flex-wrap:wrap}
.crumbs a:hover{color:var(--tx)}
.crumbs svg{width:14px;height:14px}
.crumbs [aria-current]{color:var(--tx);font-weight:600}
.phead{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;margin-bottom:24px}
.avwrap{position:relative;flex:none}
.avwrap .cam{position:absolute;right:-8px;bottom:-8px;background:var(--ac);border-color:var(--ac);color:var(--ink)}
.phead .info{flex:1;min-width:240px}
.phead h1{font-size:clamp(30px,5vw,44px);overflow-wrap:anywhere}
.titlein{width:100%;background:transparent;border:0;border-bottom:1.5px solid transparent;font-family:var(--disp);font-weight:700;font-size:clamp(26px,4.4vw,40px);line-height:1.15;padding:2px 0;letter-spacing:-.015em}
.titlein:hover,.titlein:focus{border-bottom-color:var(--line2);outline:none}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pill{background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;color:#d9dce5;display:inline-flex;gap:6px;align-items:center}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:8px;padding:11px 16px;color:var(--mu);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14.5px}
.tab:hover{color:var(--tx)}
.tab[aria-current=page]{color:var(--ac);border-bottom-color:var(--ac)}
.tab .n{background:var(--s2);border-radius:999px;padding:0 8px;font-size:12px;color:var(--mu)}
.panel{display:grid;gap:18px;max-width:900px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:6px}
.f>span{font-size:13.5px;font-weight:600;color:#cfd3de}
.f small{color:var(--mu);font-size:12.5px}
.f input,.f textarea,.f select,.dform input,.dform select,.dform textarea,.lrow input,.lrow select,.lrow textarea{background:var(--s1);border:1px solid var(--line2);border-radius:11px;padding:10px 13px;width:100%}
.f textarea,.dform textarea,.lrow textarea{resize:vertical;min-height:46px;line-height:1.6}
.f input:focus,.f textarea:focus,.f select:focus,.dform input:focus,.dform select:focus,.dform textarea:focus,.lrow input:focus,.lrow textarea:focus{outline:none;border-color:var(--ac);background:#1b2030}
.box{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px}
.box>h3{margin-bottom:12px;font-size:18px}
.lrow{display:grid;gap:10px;padding:12px;background:var(--s2);border-radius:13px;margin-bottom:10px;align-items:start;grid-template-columns:1.1fr 150px 1.6fr auto}
@media(max-width:760px){.lrow{grid-template-columns:1fr}}

/* berichten */
.mbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.mlist{display:grid;gap:16px;max-width:900px}
.msg{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px}
@media(max-width:640px){.msg{grid-template-columns:1fr;gap:6px}}
.mdate{padding-top:15px;font-weight:600;color:var(--mu);font-size:13.5px;text-align:right}
@media(max-width:640px){.mdate{text-align:left;padding-top:0}}
.mcard{background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--cc,var(--ac));border-radius:14px;padding:14px 16px}
.mcard header{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.mcard h3{font-size:17px;overflow-wrap:anywhere}
.catp{display:block;font-size:12.5px;font-weight:700;color:var(--cc,var(--ac));margin-bottom:3px}
.mwho{font-size:13.5px;color:var(--mu);margin-top:4px}
.mtxt{white-space:pre-wrap;margin-top:9px;color:#d7dae3;overflow-wrap:anywhere}
.mtxt.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.linkbtn{background:none;border:0;color:var(--ac);cursor:pointer;padding:6px 0 0;font-weight:600;font-size:13.5px}
.mact{display:flex;gap:2px;flex:none}

/* scenario's */
.srow{position:relative;display:flex;gap:14px;padding:16px 18px;background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;align-items:flex-start;transition:border-color .15s}
.srow:hover{border-color:var(--line2)}
.srow .grow{flex:1;min-width:0}
.srow h3{font-size:18px}
.srow h3 a::after{content:"";position:absolute;inset:0;border-radius:inherit}
.srow .meta{font-size:13px;color:var(--mu);margin:2px 0 8px}
.srow p{margin:0 0 4px;font-size:14px;color:#cfd3de;overflow-wrap:anywhere}
.srow .lbl{font-size:12.5px;font-weight:700;color:var(--sea)}
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:24px}
@media(max-width:860px){.mem{grid-template-columns:1fr}}
.mc{background:var(--s1);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:14px;padding:14px 14px 10px}
.mc h3{font-size:15.5px;color:var(--c);margin-bottom:6px;font-family:var(--body);font-weight:700;letter-spacing:0}
.mc textarea{background:transparent;border:0;width:100%;resize:none;padding:0;min-height:90px;line-height:1.55}
.mc textarea:focus{outline:none}
.mc.a{--c:var(--ac)}.mc.b{--c:#9db8ff}.mc.c{--c:var(--sea)}
.inv{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.inv .pill a{display:flex;gap:7px;align-items:center}
.inv .pill .iconbtn{padding:0}

/* dialogs */
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--line2);border-radius:20px;padding:0;max-width:min(520px,calc(100vw - 28px));width:100%;box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog.wide{max-width:min(660px,calc(100vw - 28px))}
dialog::backdrop{background:rgba(6,8,12,.75);backdrop-filter:blur(3px)}
.dform{padding:24px;display:grid;gap:14px}
.dform h2{font-size:23px}
.dform label{display:grid;gap:6px;font-size:13.5px;font-weight:600;color:#cfd3de}
.dact{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--s3);border:1px solid var(--line2);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:60;font-weight:600;font-size:14px}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/" aria-label="Naar het hoofdmenu"><span class="mark"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg></span>Character Database</a>
    <div class="sp"></div>
    <div class="save" id="save" role="status"><i></i><span>Opgeslagen</span></div>
  </div>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<input type="file" id="fi" accept="image/*" hidden>
<input type="file" id="fimport" accept="application/json,.json" hidden>
<div id="toast" role="status"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC={
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>',
 book:'<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/>',
 layers:'<path d="M12 3 3 8l9 5 9-5z"/><path d="m3 13 9 5 9-5"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.5.6 4 2.5 4 6"/>',
 msg:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
 note:'<path d="M5 3h14v18H5z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
 star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
 back:'<path d="m15 5-7 7 7 7"/>',
 right:'<path d="m9 5 7 7-7 7"/>',
 x:'<path d="M6 6l12 12M18 6 6 18"/>',
 camera:'<path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5"/>',
 more:'<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
 down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
 up:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
 open:'<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]||''}</svg>`;
const hue=s=>{let h=0;for(const c of String(s||'?'))h=(h*31+c.charCodeAt(0))%360;return h};
const initials=s=>(String(s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('')||'?').toUpperCase();
const snip=(t,n=150)=>{t=String(t||'').replace(/\s+/g,' ').trim();return t.length>n?t.slice(0,n-1)+'…':t};
const parseD=d=>new Date(/^\d{4}-\d{2}-\d{2}$/.test(d)?d+'T00:00':d);
const fmtDate=d=>{if(!d)return'Geen datum';const x=parseD(d);return isNaN(x)?d:x.toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'})};
const fmtShort=d=>{if(!d)return'Geen datum';const x=parseD(d);return isNaN(x)?d:x.toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'})};
const ago=ts=>{if(!ts)return'';const s=(Date.now()-ts)/1000;if(s<60)return'zojuist';if(s<3600)return Math.floor(s/60)+' min geleden';if(s<86400)return Math.floor(s/3600)+' uur geleden';if(s<172800)return'gisteren';if(s<86400*14)return Math.floor(s/86400)+' dagen geleden';return new Date(ts).toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'})};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const hobbyList=s=>String(s||'').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);

/* ---------- gegevens ---------- */
let S={v:1,chars:[],scens:[]};
const IMG=new Map();
let db=null;
const UI={q:'',sort:'naam',fav:false,hobby:'',msgCat:'alle',msgOrder:'oud'};
const CATS=[['gesprek','Gesprek'],['gezegd','Gezegd tegen iemand'],['afspraak','Afspraak of belofte'],['gebeurtenis','Gebeurtenis'],['relatie','Relatie of verandering'],['herinnering','Herinnering']];
const CATCOL={gesprek:'#9db8ff',gezegd:'#c4a6ff',afspraak:'#e8b04f',gebeurtenis:'#6fcfbd',relatie:'#f092b4',herinnering:'#b9cd7c'};
const catName=k=>(CATS.find(c=>c[0]===k)||['','Bericht'])[1];
const newChar=(o={})=>({id:uid(),name:'',nick:'',age:'',birth:'',short:'',hobbies:'',personality:'',job:'',background:'',backstory:'',extra:'',notes:'',photo:null,relations:[],messages:[],fav:false,created:Date.now(),updated:Date.now(),opened:0,...o});
const newMsg=(o={})=>({id:uid(),date:today(),title:'',cat:'gesprek',who:'',body:'',created:Date.now(),...o});
const newScen=(o={})=>({id:uid(),charId:'',title:'',desc:'',backstory:'',events:'',involved:[],others:'',keyMessages:'',agreements:'',conflicts:'',secrets:'',notes:'',status:'',last:'',next:'',created:Date.now(),updated:Date.now(),...o});
const find=(k,id)=>(k==='c'?S.chars:S.scens).find(x=>x.id===id);
const scensOf=cid=>S.scens.filter(s=>s.charId===cid);
const cname=c=>(c&&c.name)||'Naamloos personage';

/* ---------- opslag ---------- */
function openDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open('characterdatabase',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))}catch(e){rej(e)}})}
function tx(fn){return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');fn(t.objectStore('kv'));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function loadAll(){
  try{
    db=await openDB();
    const all=await new Promise((res,rej)=>{const out={};const q=db.transaction('kv').objectStore('kv').openCursor();q.onsuccess=e=>{const c=e.target.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};q.onerror=()=>rej(q.error)});
    if(all.state)S=Object.assign(S,all.state);
    for(const k in all)if(k.startsWith('img:'))IMG.set(k.slice(4),all[k]);
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  }catch(e){db=null}
}
let saveT=null;
function setStatus(s){const el=$('#save');el.className='save '+s;el.querySelector('span').textContent={saved:'Opgeslagen',saving:'Opslaan…',error:'Opslaan mislukt',memory:'Niet bewaard'}[s]}
function touch(ent){if(ent)ent.updated=Date.now();if(!db){setStatus('memory');return}setStatus('saving');clearTimeout(saveT);saveT=setTimeout(persist,350)}
async function persist(){clearTimeout(saveT);saveT=null;if(!db)return;try{await tx(st=>st.put(JSON.parse(JSON.stringify(S)),'state'));setStatus('saved')}catch(e){setStatus('error')}}
async function putImg(id,data){IMG.set(id,data);if(db){try{await tx(st=>st.put(data,'img:'+id))}catch(e){setStatus('error')}}}
async function delImg(id){IMG.delete(id);if(db){try{await tx(st=>st.delete('img:'+id))}catch(e){}}}
addEventListener('pagehide',()=>{if(saveT)persist()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveT)persist()});

function fileToData(file,max=900){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#1e2330';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.86))};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};im.src=url})}

/* ---------- UI-hulpjes ---------- */
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
const autosize=t=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight+2,800)+'px'};

function formDlg({title,fields=[],ok='Opslaan',intro='',danger=false,wide=false}){
  return new Promise(res=>{
    const d=$('#dlg');let done=false;
    d.className=wide?'wide':'';
    d.innerHTML=`<form class="dform"><h2>${esc(title)}</h2>${intro?`<p class="mu" style="margin:0">${intro}</p>`:''}${fields.map(f=>{
      const v=f.value??'';let inp;
      if(f.type==='select')inp=`<select name="${f.k}">${f.options.map(o=>`<option value="${esc(o.v)}"${o.v===v?' selected':''}>${esc(o.l)}</option>`).join('')}</select>`;
      else if(f.type==='textarea')inp=`<textarea name="${f.k}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
      else inp=`<input name="${f.k}" type="${f.type||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}"${f.req?' required':''}>`;
      return `<label>${esc(f.label)}${inp}</label>`}).join('')}
      <div class="dact"><button type="button" class="btn ghost" data-cancel>Annuleren</button><button class="btn ${danger?'dangerfill':'pri'}">${esc(ok)}</button></div></form>`;
    const form=d.querySelector('form');
    form.onsubmit=e=>{e.preventDefault();done=true;const o={};new FormData(form).forEach((v,k)=>o[k]=v);d.close();res(o)};
    form.querySelector('[data-cancel]').onclick=()=>d.close();
    d.onclose=()=>{if(!done)res(null)};
    d.showModal();
    const first=form.querySelector('input,select,textarea');if(first&&fields.length)first.focus();
  });
}
const confirmDlg=(title,text,ok='Verwijderen')=>formDlg({title,intro:text,ok,danger:true}).then(r=>!!r);

/* ---------- routing ---------- */
function route(){const p=location.hash.replace(/^#\/?/,'').split('/');if(p[0]==='p'&&p[1])return{v:'c',id:p[1],tab:p[2]||'profiel'};if(p[0]==='s'&&p[1])return{v:'s',id:p[1],tab:p[2]||'verhaal'};return{v:'home'}}
const go=h=>{if(location.hash===h)render();else location.hash=h};

/* ---------- componenten ---------- */
const av=(c,cls='')=>{const src=c&&c.photo&&IMG.get(c.photo);return src?`<img class="av ${cls}" src="${src}" alt="">`:`<div class="av ph ${cls}" style="--h:${hue(c&&c.name)}" aria-hidden="true">${esc(initials(c&&c.name))}</div>`};
const starBtn=(k,e,flat)=>`<button class="cbtn l star${flat?' flat':''}" data-act="fav" data-k="${k}" data-id="${e.id}" aria-pressed="${!!e.fav}" aria-label="${e.fav?'Verwijder uit favorieten':'Zet in favorieten'}">${ic('star')}</button>`;
function F(k,ent,b,label,o={}){
  const v=ent[b]??'';
  const common=`data-e="${k}:${ent.id}" data-b="${b}" placeholder="${esc(o.ph||'')}"`;
  const hint=o.hint?`<small>${o.hint}</small>`:'';
  if(o.line)return `<label class="f"><span>${label}</span><input type="${o.type||'text'}" ${common} value="${esc(v)}">${hint}</label>`;
  return `<label class="f"><span>${label}</span><textarea class="auto" rows="${o.rows||3}" ${common}>${esc(v)}</textarea>${hint}</label>`;
}
function tabsBar(base,list,cur,counts={}){return `<nav class="tabs" aria-label="Tabbladen">${list.map(([k,l,i])=>`<a class="tab" href="${base}/${k}"${k===cur?' aria-current="page"':''}>${ic(i)}${l}${counts[k]?`<span class="n">${counts[k]}</span>`:''}</a>`).join('')}</nav>`}

/* ---------- zoeken en sorteren ---------- */
const ageNum=c=>{const n=parseInt(c.age,10);return isNaN(n)?null:n};
const cmpAge=dir=>(a,b)=>{const x=ageNum(a),y=ageNum(b);if(x===null&&y===null)return 0;if(x===null)return 1;if(y===null)return -1;return (x-y)*dir};
const SORTS={
  naam:['Naam, A tot Z',(a,b)=>cname(a).localeCompare(cname(b),'nl')],
  nieuw:['Nieuwste eerst',(a,b)=>b.created-a.created],
  oud:['Oudste eerst',(a,b)=>a.created-b.created],
  bijgewerkt:['Laatst bijgewerkt',(a,b)=>b.updated-a.updated],
  geopend:['Laatst geopend',(a,b)=>(b.opened||0)-(a.opened||0)],
  jong:['Leeftijd, jong naar oud',cmpAge(1)],
  oudst:['Leeftijd, oud naar jong',cmpAge(-1)],
  scen:["Meeste scenario's",(a,b)=>scensOf(b.id).length-scensOf(a.id).length]
};
const CF=[['name','Naam'],['nick','Bijnaam'],['age','Leeftijd'],['birth','Geboortedatum'],['short','Korte beschrijving'],['hobbies',"Hobby's"],['personality','Persoonlijkheid'],['job','Beroep'],['background','Achtergrond'],['backstory','Backstory'],['extra','Extra informatie'],['notes','Notities']];
const SF=[['title','Naam'],['desc','Beschrijving'],['backstory','Backstory'],['events','Gebeurtenissen'],['others','Andere betrokkenen'],['keyMessages','Belangrijke berichten'],['agreements','Afspraken'],['conflicts','Conflicten'],['secrets','Geheimen'],['status','Stand van zaken'],['last','Vorige keer'],['next','Volgende keer'],['notes','Notities']];
function makeTest(q,out){
  const ql=q.toLowerCase();
  return (label,text)=>{text=String(text||'');const i=text.toLowerCase().indexOf(ql);if(i<0)return;const a=Math.max(0,i-40),b=Math.min(text.length,i+q.length+80);out.push({label,html:(a?'…':'')+esc(text.slice(a,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length,b))+(b<text.length?'…':'')})};
}
function charHits(c,q){
  const out=[],t=makeTest(q,out);
  CF.forEach(([k,l])=>t(l,c[k]));
  (c.relations||[]).forEach(r=>t('Relaties',[r.name,r.type,r.note].filter(Boolean).join(' – ')));
  (c.messages||[]).forEach(m=>t('Berichten',[m.title,m.who,m.body].filter(Boolean).join(' – ')));
  return out}
function scenHits(s,q){const out=[],t=makeTest(q,out);SF.forEach(([k,l])=>t(l,s[k]));return out}

/* ---------- hoofdmenu ---------- */
function allHobbies(){const m=new Map();S.chars.forEach(c=>hobbyList(c.hobbies).forEach(h=>{const k=h.toLowerCase();if(!m.has(k))m.set(k,h)}));return [...m].sort((a,b)=>a[1].localeCompare(b[1],'nl'))}
function cardHtml(c,hit){
  const hobs=hobbyList(c.hobbies),n=scensOf(c.id).length;
  const desc=c.short||snip(c.personality||c.background||'',140);
  return `<article class="ccard">
  <a class="pfp" href="#/p/${c.id}" aria-label="Open ${esc(cname(c))}">${av(c)}${c.age?`<span class="agebadge">${esc(c.age)}${/^\d+$/.test(String(c.age).trim())?' jaar':''}</span>`:''}</a>
  ${starBtn('c',c)}
  <button class="cbtn r" data-act="menu" data-id="${c.id}" aria-label="Meer opties voor ${esc(cname(c))}" aria-haspopup="true">${ic('more')}</button>
  <div class="menu" data-menu="${c.id}" hidden role="menu"><button role="menuitem" data-act="open" data-id="${c.id}">${ic('open')}Openen</button><button role="menuitem" data-act="dup" data-k="c" data-id="${c.id}">${ic('copy')}Dupliceren</button><button role="menuitem" class="danger" data-act="del" data-k="c" data-id="${c.id}">${ic('trash')}Verwijderen</button></div>
  <div class="ci">
    <h3><a href="#/p/${c.id}">${esc(cname(c))}</a></h3>
    ${hobs.length?`<div class="hobs">${hobs.slice(0,4).map(h=>`<span class="hob">${esc(h)}</span>`).join('')}${hobs.length>4?`<span class="hob">+${hobs.length-4}</span>`:''}</div>`:''}
    ${desc?`<p class="desc">${esc(desc)}</p>`:'<p class="desc mu">Nog geen beschrijving</p>'}
    ${hit?`<div class="hit">${esc(hit.label)}: ${hit.html}</div>`:''}
    <div class="cfoot">${ic('layers')}${n} scenario${n===1?'':"'s"}</div>

function viewHome(){
  const n=S.chars.length;
  if(!n)return `<div class="pagehead"><h1>Character Database</h1></div>
  <div class="empty"><h3>Je archief is nog leeg</h3><p>Maak je eerste personage aan. Daarna kun je er een profiel, berichten, een backstory en scenario's aan koppelen. Alles wordt automatisch bewaard.</p><button class="btn pri" data-act="new-char">${ic('plus')}Add Character</button><p style="margin-top:22px;font-size:13px">Heb je een back-up? <a href="#" data-act="import" style="color:var(--ac);text-decoration:underline">Back-up terugzetten</a></p></div>`;
  const hobs=allHobbies();
  return `<div class="pagehead"><h1>Character Database</h1><span class="mu" id="count"></span></div>
  <div class="toolbar">
    <label class="search">${ic('search')}<input id="q" type="search" placeholder="Zoek op naam of informatie, bijvoorbeeld een hobby of gebeurtenis" autocomplete="off" aria-label="Zoeken" value="${esc(UI.q)}"></label>
    <button class="btn pri" data-act="new-char">${ic('plus')}Add Character</button>
  </div>
  <div class="filters" role="group" aria-label="Filters en sorteren">
    <button class="chip" id="favchip" data-act="filter-fav" aria-pressed="${UI.fav}">${ic('star')}Favorieten <b>${S.chars.filter(c=>c.fav).length}</b></button>
    <label class="sel">Hobby<select id="fhobby" aria-label="Filter op hobby"><option value="">Alle hobby's</option>${hobs.map(([k,l])=>`<option value="${esc(k)}"${UI.hobby===k?' selected':''}>${esc(l)}</option>`).join('')}</select></label>
    <label class="sel">Sorteren<select id="fsort" aria-label="Sorteren">${Object.entries(SORTS).map(([k,v])=>`<option value="${k}"${UI.sort===k?' selected':''}>${esc(v[0])}</option>`).join('')}</select></label>
  </div>
  <div id="results"></div>
  <footer class="foot"><span>Je gegevens worden automatisch in deze browser bewaard.</span><button class="btn sm ghost" data-act="export">${ic('down')}Back-up maken</button><button class="btn sm ghost" data-act="import">${ic('up')}Back-up terugzetten</button></footer>`;
}
function renderResults(){
  const box=$('#results');if(!box)return;
  const q=UI.q.trim();
  let list=S.chars.slice();
  if(UI.fav)list=list.filter(c=>c.fav);
  if(UI.hobby)list=list.filter(c=>hobbyList(c.hobbies).some(h=>h.toLowerCase()===UI.hobby));
  const sorter=(SORTS[UI.sort]||SORTS.naam)[1];
  list.sort(sorter);
  let rows=list.map(c=>({c,h:[],nameHit:false}));
  let scenRows=[];
  if(q){
    const ql=q.toLowerCase();
    rows=rows.map(r=>({c:r.c,h:charHits(r.c,q),nameHit:(r.c.name+' '+r.c.nick).toLowerCase().includes(ql)})).filter(r=>r.h.length);
    rows.sort((a,b)=>(b.nameHit?1:0)-(a.nameHit?1:0));
    const ids=new Set(list.map(c=>c.id));
    scenRows=S.scens.filter(s=>ids.has(s.charId)).map(s=>({s,h:scenHits(s,q)})).filter(x=>x.h.length);
  }
  const cnt=$('#count');if(cnt)cnt.textContent=q||UI.fav||UI.hobby?`${rows.length} van ${S.chars.length} personages`:`${S.chars.length} personage${S.chars.length===1?'':'s'}`;
  const fc=$('#favchip');if(fc)fc.setAttribute('aria-pressed',String(UI.fav));
  let html='';
  if(rows.length)html+=`<div class="grid">${rows.map(r=>{const hit=q&&!r.nameHit?r.h[0]:null;return cardHtml(r.c,hit)}).join('')}</div>`;
  else if(!scenRows.length)html+=`<div class="empty"><h3>${q?'Niets gevonden':'Geen personages in deze selectie'}</h3><p>${q?'Probeer een andere naam of een ander trefwoord.':'Pas de filters aan om meer personages te zien.'}</p>${q||UI.fav||UI.hobby?`<button class="btn" data-act="reset-filters">Filters wissen</button>`:''}</div>`;
  if(scenRows.length)html+=`<section class="sec" style="margin-top:30px"><h2>Scenario's met “${esc(q)}”</h2>${scenRows.map(({s,h})=>{const c=find('c',s.charId);return `<article class="srow">${av(c,'s')}<div class="grow"><h3><a href="#/s/${s.id}">${esc(s.title||'Naamloos scenario')}</a></h3><div class="meta">${esc(cname(c))}</div>${h.slice(0,2).map(x=>`<p><span class="mu">${esc(x.label)}:</span> ${x.html}</p>`).join('')}</div></article>`}).join('')}</section>`;
  box.innerHTML=html;
}

/* ---------- personage ---------- */
const CTABS=[['profiel','Profiel','user'],['berichten','Berichten','msg'],['backstory','Backstory','book'],['scenarios',"Scenario's",'layers'],['notities','Notities','note']];
const RELTYPES=['Familie','Vriend(in)','Partner','Vijand','Collega','Anders'];
function msgsSorted(c){
  const dir=UI.msgOrder==='oud'?1:-1;
  return (c.messages||[]).filter(m=>UI.msgCat==='alle'||m.cat===UI.msgCat).slice().sort((a,b)=>{const d=(a.date||'9999-99-99').localeCompare(b.date||'9999-99-99');return (d||(a.created-b.created))*dir});
}
function msgHtml(c,m){
  const long=(m.body||'').length>380||(m.body||'').split('\n').length>6;
  return `<article class="msg" id="m-${m.id}"><div class="mdate">${esc(fmtShort(m.date))}</div>
  <div class="mcard" style="--cc:${CATCOL[m.cat]||'var(--ac)'}"><header><div><span class="catp">${esc(catName(m.cat))}</span><h3>${esc(m.title||'Zonder titel')}</h3></div>
  <div class="mact"><button class="iconbtn" data-act="msg-edit" data-id="${c.id}" data-m="${m.id}" aria-label="Bericht bewerken">${ic('edit')}</button><button class="iconbtn del" data-act="msg-del" data-id="${c.id}" data-m="${m.id}" aria-label="Bericht verwijderen">${ic('trash')}</button></div></header>
  ${m.who?`<div class="mwho">Met of tegen: ${esc(m.who)}</div>`:''}
  ${m.body?`<div class="mtxt${long?' clamp':''}">${esc(m.body)}</div>${long?`<button class="linkbtn" data-act="msg-more">Lees meer</button>`:''}`:''}
  </div></article>`;
}

      <button class="btn" data-act="rel-add" data-id="${c.id}">${ic('plus')}Relatie toevoegen</button></div>

    <label class="sel">Soort<select data-sel="msgcat" aria-label="Filter op soort"><option value="alle">Alle soorten</option>${CATS.map(([k,l])=>`<option value="${k}"${UI.msgCat===k?' selected':''}>${l}</option>`).join('')}</select></label>

    <p class="mu" style="margin:0">Belangrijke gesprekken, wat er tegen anderen is gezegd, afspraken en beloftes, gebeurtenissen, veranderingen in relaties en herinneringen.</p>
    ${list.length?`<div class="mlist">${list.map(m=>msgHtml(c,m)).join('')}</div>`:`<div class="empty"><h3>${all.length?'Geen berichten van deze soort':'Nog geen berichten'}</h3><p>${all.length?'Kies een andere soort om meer te zien.':'Noteer wat er is gezegd, beloofd of gebeurd, met een datum, titel en een uitgebreide notitie.'}</p></div>`}
    </div>`}
  if(tab==='backstory')body=`<div class="panel">${F('c',c,'backstory','Backstory',{rows:16,ph:'Waar komt dit personage vandaan? Wat heeft het gevormd?'})}</div>`;

  <div class="info"><h1 data-mirror="c:${c.id}:name">${esc(cname(c))}</h1>
  <div class="pills">${c.nick?`<span class="pill">Bijnaam: ${esc(c.nick)}</span>`:''}${sub.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>
  <div class="acts">${starBtn('c',c,true)}<button class="btn" data-act="new-scen" data-cid="${c.id}">${ic('plus')}Nieuw scenario</button><button class="btn" data-act="dup" data-k="c" data-id="${c.id}">${ic('copy')}Dupliceren</button>${c.photo?`<button class="btn ghost" data-act="rm-photo" data-id="${c.id}">${ic('x')}Foto verwijderen</button>`:''}<button class="btn danger" data-act="del" data-k="c" data-id="${c.id}">${ic('trash')}Verwijderen</button></div></div></header>
  ${tabsBar('#/p/'+c.id,CTABS,tab,{berichten:(c.messages||[]).length,scenarios:sc.length})}${body}`;

/* ---------- scenario ---------- */
const STABS=[['verhaal','Verhaal','book'],['personages','Betrokken personages','users'],['berichten','Belangrijke berichten','msg'],['afspraken','Afspraken en geheimen','note']];
function viewScen(s,tab){
  if(!STABS.some(t=>t[0]===tab))tab='verhaal';
  const c=find('c',s.charId);
  let body='';
  if(tab==='verhaal')body=`<div class="panel">${F('s',s,'backstory','Backstory van het scenario',{rows:9,ph:'Hoe begon dit scenario? Wat is de situatie?'})}${F('s',s,'events','Gebeurtenissen tot nu toe',{rows:12,ph:'Wat is er tot nu toe gebeurd, in volgorde?'})}</div>`;
  if(tab==='personages'){
    const others=S.chars.filter(x=>x.id!==s.charId&&!(s.involved||[]).includes(x.id));
    body=`<div class="panel"><div class="box"><h3>Wie doet er mee?</h3><div class="inv">
    ${c?`<span class="pill"><a href="#/p/${c.id}">${av(c,'xs')}${esc(cname(c))}</a><span class="mu">hoofdpersonage</span></span>`:''}
    ${(s.involved||[]).map(id=>find('c',id)).filter(Boolean).map(x=>`<span class="pill"><a href="#/p/${x.id}">${av(x,'xs')}${esc(cname(x))}</a><button class="iconbtn" data-act="uninvolve" data-id="${s.id}" data-c="${x.id}" aria-label="${esc(cname(x))} verwijderen uit dit scenario">${ic('x')}</button></span>`).join('')}</div>
    ${others.length?`<select class="inline-sel" data-sel="involve" data-id="${s.id}" aria-label="Personage toevoegen"><option value="">Personage uit de database toevoegen…</option>${others.map(x=>`<option value="${x.id}">${esc(cname(x))}</option>`).join('')}</select>`:`<p class="mu" style="margin:0">${S.chars.length>1?'Alle personages doen al mee.':'Voeg meer personages toe aan de database om ze hier te koppelen.'}</p>`}</div>
    ${F('s',s,'others','Andere betrokkenen',{rows:4,ph:'Mensen die niet in de database staan'})}</div>`}
  if(tab==='berichten')body=`<div class="panel">${F('s',s,'keyMessages','Belangrijke berichten',{rows:18,ph:'Wie zei wat, en wanneer? Wat moet je later kunnen teruglezen?'})}</div>`;
  if(tab==='afspraken')body=`<div class="panel">${F('s',s,'agreements','Afspraken',{rows:6,ph:'Wat is er afgesproken of beloofd?'})}${F('s',s,'conflicts','Conflicten',{rows:6})}${F('s',s,'secrets','Geheimen',{rows:6,ph:'Wie weet wat, en wie niet?'})}${F('s',s,'notes','Overige notities',{rows:6})}</div>`;
  const m=(cls,b,t,ph)=>`<div class="mc ${cls}"><h3>${t}</h3><textarea class="auto" data-e="s:${s.id}" data-b="${b}" placeholder="${esc(ph)}" aria-label="${esc(t)}">${esc(s[b])}</textarea></div>`;
  return `<div class="topnav"><a class="btn sm" href="#/">${ic('back')}Hoofdmenu</a>${c?`<a class="btn sm" href="#/p/${c.id}/scenarios">${ic('back')}${esc(cname(c))}</a>`:''}<nav class="crumbs" aria-label="Pad"><a href="#/">Character Database</a>${ic('right')}${c?`<a href="#/p/${c.id}">${esc(cname(c))}</a>${ic('right')}<a href="#/p/${c.id}/scenarios">Scenario's</a>${ic('right')}`:''}<span aria-current="page">${esc(s.title||'Naamloos scenario')}</span></nav></div>
  <header style="margin-bottom:20px;max-width:900px">
    <input class="titlein" data-e="s:${s.id}" data-b="title" value="${esc(s.title)}" placeholder="Naam van het scenario" aria-label="Naam van het scenario">
    <label class="f" style="margin-top:8px"><span class="mu" style="font-weight:600;font-size:13.5px">Beschrijving</span><textarea class="auto" rows="2" data-e="s:${s.id}" data-b="desc" placeholder="Waar gaat dit scenario over?" style="background:var(--s1);border:1px solid var(--line2);border-radius:11px;padding:10px 13px;width:100%;resize:vertical">${esc(s.desc)}</textarea></label>
    <div class="acts"><button class="btn" data-act="dup" data-k="s" data-id="${s.id}">${ic('copy')}Dupliceren</button><button class="btn danger" data-act="del" data-k="s" data-id="${s.id}">${ic('trash')}Verwijderen</button></div></header>
  <section class="mem" aria-label="Snel terug in het verhaal">${m('a','status','Laatste stand van zaken','Hoe staan de zaken er nu voor?')}${m('b','last','Vorige keer gebeurde dit...','Wat gebeurde er de vorige keer?')}${m('c','next','Volgende keer verder met...','Waar ga je straks verder?')}</section>
  ${tabsBar('#/s/'+s.id,STABS,tab)}${body}`;
}

/* ---------- render ---------- */
let lastKey='';
function render(){
  const app=$('#app'),r=route(),key=location.hash;
  const y=key===lastKey?scrollY:0;lastKey=key;
  let html='';
  if(!db)html+=`<div class="warn">Bewaren in deze browser lukt niet. Maak regelmatig een back-up (onderaan het hoofdmenu), anders gaan je gegevens verloren zodra je de pagina sluit.</div>`;
  if(r.v==='c'){const c=find('c',r.id);if(!c){location.hash='#/';return}c.opened=Date.now();if(db){clearTimeout(saveT);saveT=setTimeout(persist,800)}html+=viewChar(c,r.tab)}
  else if(r.v==='s'){const s=find('s',r.id);if(!s){location.hash='#/';return}html+=viewScen(s,r.tab)}
  else html+=viewHome();
  app.innerHTML=html;
  if(r.v==='home')renderResults();
  app.querySelectorAll('textarea.auto').forEach(autosize);
  scrollTo(0,y);
}
addEventListener('hashchange',render);

/* ---------- invoer en automatisch opslaan ---------- */
const app=$('#app');
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){UI.q=t.value;renderResults();return}
  if(!t.dataset.e)return;
  const [k,id]=t.dataset.e.split(':');const ent=find(k,id);if(!ent)return;
  if(t.dataset.b){ent[t.dataset.b]=t.value;
    document.querySelectorAll(`[data-mirror="${k}:${id}:${t.dataset.b}"]`).forEach(m=>m.textContent=t.value||(k==='c'?'Naamloos personage':''));}
  else if(t.dataset.l){const [list,rid,f]=t.dataset.l.split(':');const it=(ent[list]||[]).find(x=>x.id===rid);if(it)it[f]=t.value}
  if(t.tagName==='TEXTAREA')autosize(t);
  touch(ent);
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fhobby'){UI.hobby=t.value;renderResults();return}
  if(t.id==='fsort'){UI.sort=t.value;renderResults();return}
  if(t.dataset.sel==='msgcat'){UI.msgCat=t.value;render();return}
  if(t.dataset.sel==='msgorder'){UI.msgOrder=t.value;render();return}
  if(t.dataset.sel==='involve'&&t.value){const s=find('s',t.dataset.id);(s.involved=s.involved||[]).push(t.value);touch(s);render()}
  if(t.dataset.e&&t.dataset.l&&t.tagName==='SELECT'){/* relatiesoort: al verwerkt door input-handler */}
});

/* ---------- acties ---------- */
let pending=null;
$('#fi').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f||!pending)return;const id=pending;pending=null;
  const c=find('c',id);if(!c)return;
  if(!f.type.startsWith('image/')){toast('Kies een afbeelding');return}
  try{const d=await fileToData(f),iid=uid();await putImg(iid,d);if(c.photo)await delImg(c.photo);c.photo=iid;touch(c);render();toast('Profielfoto opgeslagen')}
  catch(err){toast('Deze foto kon niet geladen worden')}
});

async function cloneChar(c,withScens){
  const j=JSON.parse(JSON.stringify(c));
  const n=newChar({...j,id:uid(),name:(c.name||'Naamloos personage')+' (kopie)',fav:false,created:Date.now(),updated:Date.now(),opened:0,photo:null});
  if(c.photo&&IMG.get(c.photo)){const nid=uid();await putImg(nid,IMG.get(c.photo));n.photo=nid}
  n.relations=(n.relations||[]).map(x=>({...x,id:uid()}));
  n.messages=(n.messages||[]).map(x=>({...x,id:uid()}));
  S.chars.push(n);
  if(withScens)for(const s of scensOf(c.id))cloneScen(s,n.id,true);
  return n}
function cloneScen(s,cid,keepTitle){
  const j=JSON.parse(JSON.stringify(s));
  const n=newScen({...j,id:uid(),charId:cid||s.charId,title:keepTitle?s.title:(s.title||'Naamloos scenario')+' (kopie)',created:Date.now(),updated:Date.now()});
  S.scens.push(n);return n}

async function msgDialog(c,m){
  const r=await formDlg({title:m?'Bericht bewerken':'Nieuw bericht',wide:true,ok:m?'Wijzigingen opslaan':'Bericht opslaan',fields:[
    {k:'date',label:'Datum',type:'date',value:m?m.date:today(),req:1},
    {k:'title',label:'Titel',req:1,value:m?m.title:'',ph:'Bijvoorbeeld: Belofte aan Mila'},
    {k:'cat',label:'Soort',type:'select',value:m?m.cat:'gesprek',options:CATS.map(([v,l])=>({v,l}))},
    {k:'who',label:'Met wie of tegen wie (optioneel)',value:m?m.who:''},
    {k:'body',label:'Notitie',type:'textarea',rows:9,value:m?m.body:'',ph:'Schrijf alles op wat je later wilt terugvinden'}]});
  if(!r)return;
  if(m){Object.assign(m,{date:r.date,title:r.title.trim(),cat:r.cat,who:r.who.trim(),body:r.body});toast('Bericht bijgewerkt')}
  else{(c.messages=c.messages||[]).push(newMsg({date:r.date,title:r.title.trim(),cat:r.cat,who:r.who.trim(),body:r.body}));toast('Bericht toegevoegd')}
  touch(c);go('#/p/'+c.id+'/berichten');
}

async function exportData(){
  await persist();
  const imgs={};IMG.forEach((v,k)=>imgs[k]=v);
  const data=JSON.stringify({app:'characterdatabase',version:1,exported:new Date().toISOString(),state:S,images:imgs});
  try{const dl=window.claude&&await claude.use('downloads');if(!dl){toast('Downloaden is hier niet beschikbaar');return}await dl.save({filename:'character-database-backup-'+today()+'.json',data});}
  catch(e){if(!e||e.code!=='declined')toast('Back-up maken is niet gelukt')}
}
function convertOld(j){
  const st=j.state||{},imgs=j.images||{},join=a=>a.filter(Boolean).join('\n\n');
  const chars=(st.chars||[]).map(o=>newChar({
    id:o.id||uid(),name:o.name||'',nick:o.nick||'',age:o.age||'',birth:o.birth||'',hobbies:o.hobbies||'',personality:o.personality||'',job:o.job||'',
    photo:o.photo&&imgs[o.photo]?o.photo:null,
    background:join([o.background,o.home&&'Woonplaats: '+o.home]),
    backstory:o.backstory||'',
    extra:join([o.extra,o.skills&&'Vaardigheden: '+o.skills,o.strengths&&'Sterke punten: '+o.strengths,o.weaknesses&&'Zwakke punten: '+o.weaknesses,o.goals&&'Doelen en dromen: '+o.goals,o.secrets&&'Geheimen: '+o.secrets]),
    notes:join([o.notes,o.memories&&'Herinneringen: '+o.memories,o.remember&&'Wat moet ik onthouden: '+o.remember,o.last&&'Vorige keer: '+o.last,o.next&&'Volgende keer: '+o.next]),
    relations:(o.relations||[]).map(r=>({id:uid(),name:r.name||'',type:r.type||'Anders',note:r.note||''})),
    messages:(o.timeline||[]).map(t=>newMsg({date:t.date||today(),title:t.title||'Gebeurtenis',cat:'gebeurtenis',body:t.text||''})),
    fav:!!o.fav,created:o.created||Date.now(),updated:o.updated||Date.now()}));
  const scens=(st.scens||[]).map(o=>newScen({
    id:o.id||uid(),charId:o.charId||'',title:o.title||'',desc:o.summary||'',backstory:o.backstory||'',events:o.sofar||'',involved:o.involved||[],others:o.others||'',keyMessages:o.key||'',
    agreements:o.remember||'',last:o.last||'',next:o.next||'',
    notes:join([o.notes,o.changes&&'Relaties en veranderingen: '+o.changes,o.open&&'Openstaande verhaallijnen: '+o.open,(o.todos||[]).length&&'Taken:\n'+o.todos.map(t=>(t.done?'[x] ':'[ ] ')+t.text).join('\n')]),
    created:o.created||Date.now(),updated:o.updated||Date.now()}));
  const keep={};chars.forEach(c=>{if(c.photo)keep[c.photo]=imgs[c.photo]});
  return {chars,scens,images:keep};
}
$('#fimport').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const j=JSON.parse(await f.text());
    if(j.app==='characterdatabase'&&j.state){
      if(!await formDlg({title:'Back-up terugzetten?',intro:'Alle huidige gegevens in deze browser worden vervangen door de back-up.',ok:'Terugzetten',danger:true}))return;
      for(const id of [...IMG.keys()])await delImg(id);
      S=Object.assign({v:1,chars:[],scens:[]},j.state);
      for(const k in j.images||{})await putImg(k,j.images[k]);
    }else if(j.app==='personagegeheugen'&&j.state){
      if(!await formDlg({title:'Back-up van “Mijn personages” importeren?',intro:'Personages en scenario\'s uit die back-up worden toegevoegd aan je huidige gegevens. Wat je nu hebt blijft staan.',ok:'Importeren'}))return;
      const o=convertOld(j);
      const have=new Set([...S.chars.map(c=>c.id),...S.scens.map(s=>s.id)]);
      o.chars.forEach(c=>{if(have.has(c.id))c.id=uid()});
      const remap={};j.state.chars.forEach((old,i)=>remap[old.id]=o.chars[i].id);
      o.scens.forEach(s=>{if(have.has(s.id))s.id=uid();s.charId=remap[s.charId]||s.charId;s.involved=(s.involved||[]).map(x=>remap[x]||x)});
      for(const k in o.images)await putImg(k,o.images[k]);
      S.chars.push(...o.chars);S.scens.push(...o.scens);
    }else throw 0;
    await persist();location.hash='#/';render();toast('Back-up verwerkt');
  }catch(err){toast('Dit is geen geldige back-up')}
});

function closeMenus(except){document.querySelectorAll('.menu').forEach(m=>{if(m!==except)m.hidden=true})}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus()});
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.dataset.act!=='menu'){if(!e.target.closest('.menu'))closeMenus()}
  if(!el)return;
  const a=el.dataset.act,k=el.dataset.k,id=el.dataset.id;
  switch(a){
  case 'menu':{e.preventDefault();const m=document.querySelector(`[data-menu="${id}"]`);closeMenus(m);if(m)m.hidden=!m.hidden;break}
  case 'open':go('#/p/'+id);break;
  case 'new-char':{
    const r=await formDlg({title:'Nieuw personage',fields:[{k:'name',label:'Volledige naam',req:1,ph:'Bijvoorbeeld: Lena de Vries'},{k:'nick',label:'Bijnaam (optioneel)'},{k:'age',label:'Leeftijd (optioneel)'}],ok:'Personage aanmaken'});
    if(r){const c=newChar({name:r.name.trim(),nick:r.nick.trim(),age:r.age.trim()});S.chars.push(c);touch(c);go('#/p/'+c.id+'/profiel');toast('Personage aangemaakt')}break}
  case 'new-scen':{
    const r=await formDlg({title:'Nieuw scenario',fields:[{k:'title',label:'Naam van het scenario',req:1},{k:'desc',label:'Beschrijving (optioneel)',type:'textarea'}],ok:'Scenario aanmaken'});
    if(r){const s=newScen({charId:el.dataset.cid,title:r.title.trim(),desc:r.desc.trim()});S.scens.push(s);touch(s);go('#/s/'+s.id+'/verhaal');toast('Scenario aangemaakt')}break}
  case 'fav':{e.preventDefault();const x=find(k,id);x.fav=!x.fav;touch();const r=route();if(r.v==='home')render();else render();break}
  case 'filter-fav':UI.fav=!UI.fav;renderResults();break;
  case 'reset-filters':UI.q='';UI.fav=false;UI.hobby='';render();break;
  case 'pick-photo':pending=id;$('#fi').click();break;
  case 'rm-photo':{const c=find('c',id);if(c.photo&&await confirmDlg('Profielfoto verwijderen?','De foto wordt definitief verwijderd.')){await delImg(c.photo);c.photo=null;touch(c);render()}break}
  case 'rel-add':{const c=find('c',id);(c.relations=c.relations||[]).push({id:uid(),name:'',type:'Vriend(in)',note:''});touch(c);render();break}
  case 'rel-del':{const c=find('c',id);if(await confirmDlg('Relatie verwijderen?','Deze relatie wordt definitief verwijderd.')){c.relations=c.relations.filter(x=>x.id!==el.dataset.r);touch(c);render()}break}
  case 'msg-add':msgDialog(find('c',id),null);break;
  case 'msg-edit':{const c=find('c',id);msgDialog(c,c.messages.find(m=>m.id===el.dataset.m));break}
  case 'msg-del':{const c=find('c',id);const m=c.messages.find(x=>x.id===el.dataset.m);if(await confirmDlg('Bericht verwijderen?',`“${esc(m.title||'Zonder titel')}” wordt definitief verwijderd.`)){c.messages=c.messages.filter(x=>x.id!==m.id);touch(c);render();toast('Bericht verwijderd')}break}
  case 'msg-more':{const t=el.previousElementSibling;const open=t.classList.toggle('clamp');el.textContent=open?'Lees meer':'Minder tonen';break}
  case 'uninvolve':{const s=find('s',id);s.involved=s.involved.filter(x=>x!==el.dataset.c);touch(s);render();break}
  case 'dup':{
    if(k==='c'){const c=find('c',id),n=scensOf(id).length;
      const r=await formDlg({title:'Personage dupliceren',fields:n?[{k:'w',label:'Wat wil je kopiëren?',type:'select',value:'a',options:[{v:'a',l:'Alleen het personage'},{v:'b',l:`Personage met ${n} scenario${n===1?'':"'s"}`}]}]:[],intro:n?'':'Alle gegevens, berichten en de profielfoto worden gekopieerd.',ok:'Dupliceren'});
      if(r){const x=await cloneChar(c,r.w==='b');touch(x);go('#/p/'+x.id);toast('Personage gedupliceerd')}}
    else{const s=find('s',id),x=cloneScen(s);touch(x);go('#/s/'+x.id);toast('Scenario gedupliceerd')}
    break}
  case 'del':{
    if(k==='c'){const c=find('c',id),sc=scensOf(id);
      if(await confirmDlg('Personage verwijderen?',`“${esc(cname(c))}”${sc.length?` en ${sc.length} bijbehorend${sc.length===1?'':'e'} scenario${sc.length===1?'':"'s"}`:''} worden definitief verwijderd, inclusief de profielfoto en alle berichten. Dit kan niet ongedaan worden gemaakt.`,'Definitief verwijderen')){
        if(c.photo)await delImg(c.photo);
        S.scens=S.scens.filter(s=>s.charId!==id);S.chars=S.chars.filter(x=>x.id!==id);
        S.scens.forEach(s=>s.involved=(s.involved||[]).filter(x=>x!==id));
        touch();await persist();go('#/');toast('Personage verwijderd')}}
    else{const s=find('s',id);
      if(await confirmDlg('Scenario verwijderen?',`“${esc(s.title||'Naamloos scenario')}” wordt definitief verwijderd. Dit kan niet ongedaan worden gemaakt.`,'Definitief verwijderen')){
        const cid=s.charId;S.scens=S.scens.filter(x=>x.id!==id);touch();await persist();go(find('c',cid)?'#/p/'+cid+'/scenarios':'#/');toast('Scenario verwijderd')}}
    break}
  case 'export':exportData();break;
  case 'import':e.preventDefault();$('#fimport').click();break;
  }
});

/* ---------- start ---------- */
(async()=>{await loadAll();setStatus(db?'saved':'memory');render()})();
</script>
</body>
